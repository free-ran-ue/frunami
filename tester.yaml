# frunami-tester dev config. frunami's config.yaml backend.tester must point at
# this listen address with the same apiToken.
# how frunami lists this tester (Testers page); the host name when empty
testerName: "default-tester"
listen: "127.0.0.1:9100"
apiToken: "frunami-tester"

logger:
  level: "info" # error, warn, info, debug, trace
