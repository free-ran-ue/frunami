name: Docker

on:
  schedule:
    - cron: '14 19 * * *'  # UTC 19:14 (Local 03:14)
  push:
    tags: ['v*.*.*']
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: alonza0314/frunami
  TESTER_IMAGE_NAME: alonza0314/frunami-tester

jobs:
  build:
    name: Build Check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: ./docker/build_image.sh test

      - name: Test Docker image
        run: |
          docker images
          docker run --rm ${{ env.IMAGE_NAME }}:test ls /frunami/frunami
          docker run --rm ${{ env.IMAGE_NAME }}:test ls /frunami/frontend

      - name: Test frunami-tester Docker image
        run: |
          docker run --rm ${{ env.TESTER_IMAGE_NAME }}:test ls /frunami-tester/frunami-tester
          docker run --rm ${{ env.TESTER_IMAGE_NAME }}:test ./frunami-tester --help

  version-release:
    name: Release Version Image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Build and push frunami-tester
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tester.Dockerfile
          push: true
          tags: ${{ env.TESTER_IMAGE_NAME }}:${{ github.ref_name }}

  latest-release:
    name: Release Latest Image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Build and push frunami-tester
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tester.Dockerfile
          push: true
          tags: ${{ env.TESTER_IMAGE_NAME }}:latest
